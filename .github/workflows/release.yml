name: Build & Release APK

on:
  workflow_dispatch:

  # AUTOMATIC TRIGGER (commented out — uncomment to enable auto-build on push)
  # push:
  #   branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > zero-keystore.jks

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=zero-keystore.jks
          EOF

      - name: Read app version
        id: version
        run: |
          version_name=$(./gradlew -q :app:printVersionName)
          test -n "$version_name"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      - name: Prepare release artifact
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk \
             release/study-tracker-${{ steps.version.outputs.name }}.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Study Tracker ${{ steps.version.outputs.tag }}
          body: |
            Version ${{ steps.version.outputs.name }}.
            Commit: ${{ github.sha }}
          files: release/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
